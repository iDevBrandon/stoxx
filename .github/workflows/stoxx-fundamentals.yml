name: Stoxx — Fetch Fundamentals

on:
  schedule:
    # Weekly, Monday 11:00 AM New York time (EDT, UTC-4). Fundamentals only
    # change quarterly/annually, so this runs far less often than the daily
    # signals workflow.
    - cron: "0 15 * * 1"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch-fundamentals:
    name: Run fundamentals evaluator for IOO/QQQ/VOO universe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: toolkit/stock-evaluator/requirements.txt

      - name: Install dependencies
        run: pip install -r toolkit/stock-evaluator/requirements.txt

      - name: Run fundamentals evaluator
        working-directory: toolkit/stock-evaluator
        run: python fundamentals.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::fundamentals evaluator failed — check logs above"
