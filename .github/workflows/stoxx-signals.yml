name: Stoxx — Fetch IOO Signals

on:
  schedule:
    # Runs daily at 01:00 UTC (after Asian markets open, before EU/US)
    - cron: "0 1 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch-signals:
    name: Run stock-evaluator for IOO Global 100
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: toolkit/stock-evaluator/requirements.txt

      - name: Install dependencies
        run: pip install -r toolkit/stock-evaluator/requirements.txt

      - name: Run stock evaluator (IOO)
        working-directory: toolkit/stock-evaluator
        run: python main.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::stock-evaluator failed — check logs above"
