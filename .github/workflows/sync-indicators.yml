name: Sync Indicators to Supabase

on:
  schedule:
    - cron: '0 14 * * 1-5'  # Weekdays 10am ET (14 UTC), market hours only
    - cron: '30 20 * * 1-5' # Weekdays 4:30pm ET (20:30 UTC), after market close
  workflow_dispatch:        # Manual execution

jobs:
  fetch-and-sync-indicators:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('indices/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r indices/requirements.txt
          pip install supabase
          playwright install chromium

      - name: Fetch Indicators and Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd indices
          python fetch_all_indicators.py --sequential
          python upload_indicators.py

      - name: Check for failures
        if: failure()
        run: echo "Indicator fetching and synchronization failed - check logs"
