# .github/workflows/sync-indicators.yml
name: Sync Indicators to Supabase

on:
  schedule:
    - cron: '30 14,19 * * 1-5'  # 1 hour after market open (10:30 AM ET) and 1 hour before close (3:00 PM ET)
  workflow_dispatch:             # Manual execution

jobs:
  run-indicators-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-indicators-${{ hashFiles('stoxx/indices/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-indicators-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd stoxx/indices
          pip install -r requirements.txt

      - name: Fetch All Indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd stoxx/indices
          python fetch_all_indicators.py --output ../../fetch_indicators_summary.json

      - name: Insert Indicators to Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd stoxx/indices
          python insert_indicators.py --input ../../fetch_indicators_summary.json

      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicators-sync-summary
          path: fetch_indicators_summary.json
          retention-days: 7

      - name: Check for failures
        if: failure()
        run: echo "Indicators sync failed - check logs and artifacts"