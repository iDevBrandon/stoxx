name: Stoxx — EPS History (Alpha Vantage)

# Parallel shards: each job runs on its own GitHub runner (a distinct IP) with
# its own Alpha Vantage key and its own 25-ticker slice of the pending universe.
# 4 keys × 25 = 100 new tickers per run. Alpha Vantage caps each key at 25/day,
# so this pulls ~100/day — a daily schedule walks the top-500 in ~5 days.
#
# Keys live here (not in Secrets) on purpose — they're disposable free AV keys.
# Keep this repo PRIVATE, and rotate them if it ever goes public.
# To go faster, add more { key, offset } rows (offset grows by 25 each).

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * *"         # daily 06:00 UTC

jobs:
  eps:
    name: EPS shard (offset ${{ matrix.offset }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false          # one shard failing must not cancel the others
      max-parallel: 4
      matrix:
        include:
          - { key: HW0UW8UKOT5J33CR, offset: 0 }
          - { key: RSMMBD25R52KYN0U, offset: 25 }
          - { key: 7PVM9TVIDOZQSGHA, offset: 50 }
          - { key: 9NN0G07UZBBMDY6G, offset: 75 }

    env:
      FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
      FINANCE_SECRET_KEY:   ${{ secrets.FINANCE_SECRET_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ matrix.key }}
      EPS_OFFSET:           ${{ matrix.offset }}
      EPS_LIMIT:            "25"
      EPS_SLEEP:            "13"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: eps/requirements.txt

      - name: Install dependencies
        run: pip install -r eps/requirements.txt

      - name: Run EPS crawler shard
        run: python eps/main.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::EPS shard (offset ${{ matrix.offset }}) failed — check logs above"
